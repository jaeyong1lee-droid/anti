<!DOCTYPE html>
<html lang="ko" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="description" content="기술사 시험 합격을 위한 망각곡선 기반 Spaced Repetition 복습 관리 솔루션. AI 기출 예상문제 연동 지원." />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>기술사 Spaced Repetition 복습 관리 시스템</title>
    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- 🚀 [Asset 404 Error Auto Recovery]: 새 배포 발생 시 구버전 캐시 404 리소스 에러 자동 감지 및 즉시 리로드 -->
    <script>
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          const src = e.target.src || e.target.href;
          if (src && src.includes('/assets/') && !window.__isReloadingChunkError) {
            window.__isReloadingChunkError = true;
            console.warn('[Asset Auto Recovery] Old bundle 404 detected. Clearing cache and reloading latest assets:', src);
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                let unregCount = 0;
                if (!regs.length) window.location.reload(true);
                for (let reg of regs) {
                  reg.unregister().then(function() {
                    unregCount++;
                    if (unregCount >= regs.length) window.location.reload(true);
                  });
                }
              }).catch(function() { window.location.reload(true); });
            } else {
              window.location.reload(true);
            }
          }
        }
      }, true);
    </script>
  </head>
  <body class="bg-slateCustom-950 text-slate-100 antialiased font-sans h-full min-h-screen">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
