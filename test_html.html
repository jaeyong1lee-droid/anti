<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="background: #0f172a; color: white;">
<div id="root"></div>
<script>
  const html = `<svg width="100%" viewBox="0 0 800 450" style="background-color: #1e1e1e;" xmlns="http://www.w3.org/2000/svg">
<!-- 배경 그리드 및 영역 구분 →
<rect width="800" height="450" fill="#1e1e1e"/>

<!-- 지표면 선 →
<line x1="100" y1="120" x2="700" y2="120" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8,4"/>
</svg>`;
  document.getElementById('root').innerHTML = html;
</script>
</body>
</html>
